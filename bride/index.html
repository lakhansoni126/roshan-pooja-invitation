<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pooja & Roshan - Wedding Invitation</title>
  <meta name="description" content="You are cordially invited to the wedding of Pooja & Roshan on Monday, 30 November 2026. Tap to reveal the invitation.">
  <link rel="canonical" href="https://pooja-roshan-invitation.netlify.app/bride/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pooja & Roshan Wedding">
  <meta property="og:title" content="Pooja & Roshan - Wedding Invitation">
  <meta property="og:description" content="You are cordially invited to the wedding of Pooja & Roshan on Monday, 30 November 2026. Tap to reveal the invitation.">
  <meta property="og:url" content="https://pooja-roshan-invitation.netlify.app/bride/">
  <meta property="og:image" content="https://pooja-roshan-invitation.netlify.app/assets/og-bride.jpg">
  <meta property="og:image:secure_url" content="https://pooja-roshan-invitation.netlify.app/assets/og-bride.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="720">
  <meta property="og:image:height" content="1280">
  <meta property="og:image:alt" content="Tap to reveal - Pooja & Roshan wedding invitation">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pooja & Roshan - Wedding Invitation">
  <meta name="twitter:description" content="You are cordially invited to the wedding of Pooja & Roshan on Monday, 30 November 2026. Tap to reveal the invitation.">
  <meta name="twitter:image" content="https://pooja-roshan-invitation.netlify.app/assets/og-bride.jpg">
  <meta name="theme-color" content="#8a4f4c">
  <link rel="icon" href="../assets/favicon-bride.png" type="image/png">
  <link rel="apple-touch-icon" href="../assets/favicon-bride.png">
  <link rel="preload" href="../assets/bride-poster.jpg" as="image" fetchpriority="high">
  <link rel="stylesheet" href="../assets/fonts-bride.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="no-scroll">

<audio id="bg-music" loop preload="none"></audio>

<!-- music toggle -->
<button id="audio-btn" type="button" aria-label="Toggle music">
  <svg id="audio-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
  <svg id="audio-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
</button>

<!-- ============ INTRO: tap to reveal ============ -->
<div class="video-intro" id="intro">
  <video id="introVideo" playsinline muted preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback nofullscreen"></video>
  <img id="introCover" class="intro-cover" alt="Tap to reveal">
</div>
<canvas id="petals-canvas" aria-hidden="true"></canvas>
<canvas id="confetti-canvas" aria-hidden="true"></canvas>

<div id="main-content">

  <!-- ============ HERO ============ -->
  <section id="hero">
    <div class="hero-corner"><span></span></div>
    <div class="hero-card" data-reveal>
      <img class="hero-icon reveal" id="ganesh" alt="Ganesha">
      <div class="god-quote reveal" id="shloka"></div>
      <div class="intro-text reveal" id="introText"></div>
      <div class="couple-name shimmer reveal" id="name1"></div>
      <div class="amp-row reveal"><span class="amp-line"></span><span class="amp">&amp;</span><span class="amp-line"></span></div>
      <div class="couple-name shimmer reveal" id="name2"></div>
      <div class="parent-sub reveal" id="parents"></div>
    </div>
    <div class="scroll-indicator">
      <span id="scrollLabel"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </div>
  </section>

  <!-- ============ SAVE THE DATE (scratch) ============ -->
  <section id="scratch-section" class="scratch-section" data-reveal>
    <span class="scratch-title-sub reveal" id="sdLabel"></span>
    <h2 class="scratch-title reveal" id="sdTitle"></h2>
    <div class="scratch-desc reveal" id="sdDesc"></div>
    <div class="scratch-grid reveal" id="scratchGrid"></div>
  </section>

  <!-- everything below unlocks after the three cards are scratched -->
  <div class="locked-content" id="locked">

    <!-- ============ COUNTDOWN ============ -->
    <section id="countdown-section" class="scratch-section" data-reveal>
      <div class="cd-card reveal">
        <div class="cd-quote" id="cdQuote"></div>
        <span class="cd-script" id="cdScript"></span>
        <span class="cd-date" id="cdDate"></span>
        <div class="cd-grid">
          <div class="cd-unit"><span class="cd-num" id="cdDays">00</span><span class="cd-lbl">Days</span></div>
          <div class="cd-unit"><span class="cd-num" id="cdHours">00</span><span class="cd-lbl">Hours</span></div>
          <div class="cd-unit"><span class="cd-num" id="cdMins">00</span><span class="cd-lbl">Mins</span></div>
          <div class="cd-unit"><span class="cd-num" id="cdSecs">00</span><span class="cd-lbl">Secs</span></div>
        </div>
      </div>
    </section>

    <!-- ============ OUR STORY ============ -->
    <section id="story-section">
      <div class="story-head">
        <span class="scratch-title-sub" id="storyLabel"></span>
        <h2 class="scratch-title story-title" id="storyTitle"></h2>
      </div>
      <div class="story-stack-container" id="storyStack"></div>
    </section>

    <!-- ============ VENUE ============ -->
    <section id="venue-section" data-reveal>
      <span class="sec-label reveal" id="venueLabel"></span>
      <h2 class="sec-heading reveal" id="venueTitle"></h2>
      <div class="venue-card reveal">
        <div class="venue-img-wrap">
          <iframe id="venueMap" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
          <div class="venue-img-tint"></div>
        </div>
        <div class="venue-info">
          <div class="venue-star">✦</div>
          <h3 class="venue-name" id="venueName"></h3>
          <p class="venue-addr" id="venueAddr"></p>
          <a class="venue-btn" id="venueBtn" target="_blank" rel="noopener">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span id="venueBtnLabel"></span>
          </a>
        </div>
      </div>
    </section>

    <!-- ============ FESTIVITIES ============ -->
    <section id="events-section">
      <span class="scratch-title-sub events-label" id="eventsLabel"></span>
      <h2 class="scratch-title events-title" id="eventsTitle"></h2>
      <div class="events-stack" id="eventsStack"></div>
    </section>

    <!-- ============ RSVP ============ -->
    <section id="rsvp-section">
      <div id="rsvpForm">
        <span class="scratch-title-sub events-label" id="rsvpLabel"></span>
        <h2 class="scratch-title rsvp-title" id="rsvpTitle"></h2>
        <p class="rsvp-intro" id="rsvpIntro"></p>
        <form class="rsvp-form" id="rsvp" novalidate>
          <div class="evt-details rsvp-box">
            <p class="rsvp-q">Your details</p>
            <div class="rsvp-field">
              <label class="rsvp-lbl" for="rName">Your name</label>
              <input class="rsvp-line" id="rName" type="text" placeholder="Full name" autocomplete="name">
            </div>
            <div class="rsvp-field" style="margin-bottom:0">
              <label class="rsvp-lbl" for="rPhone">Phone number</label>
              <div class="rsvp-phone"><span class="rsvp-cc">+91</span><input class="rsvp-line" id="rPhone" type="tel" placeholder="00000 00000" autocomplete="tel"></div>
            </div>
          </div>

          <div class="evt-details rsvp-box">
            <p class="rsvp-q">Will you join us?</p>
            <label class="rsvp-choice yes active" id="choiceYes"><input type="radio" name="attending" value="yes" checked>Joyfully accept 🎉</label>
            <label class="rsvp-choice no" id="choiceNo"><input type="radio" name="attending" value="no">Regrettably decline</label>
          </div>

          <div id="rsvpExtra">
            <div class="evt-details rsvp-box">
              <p class="rsvp-q">Party size</p>
              <select class="rsvp-select" id="rSize">
                <option value="1">1 (Just me)</option><option value="2">2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option><option value="5">5 guests</option><option value="6+">6 or more</option>
              </select>
            </div>
            <div class="evt-details rsvp-box">
              <p class="rsvp-q">Events you'll attend</p>
              <div class="rsvp-events" id="rsvpEvents"></div>
            </div>
            <div class="evt-details rsvp-box">
              <p class="rsvp-q">A song for the dance floor</p>
              <input class="rsvp-line" id="rSong" type="text" placeholder="e.g. Kala Chashma">
            </div>
            <div class="evt-details rsvp-box">
              <p class="rsvp-q">🍽️ Dietary preferences</p>
              <select class="rsvp-select round" id="rDiet">
                <option value="No specific preferences">No specific preferences</option><option value="Vegetarian">Vegetarian</option><option value="Vegan">Vegan</option><option value="Jain food">Jain Food</option><option value="Other">Other</option>
              </select>
            </div>
            <div class="evt-details rsvp-box last">
              <p class="rsvp-q">Marriage advice for us</p>
              <textarea class="rsvp-area" id="rAdvice" placeholder="Share something sweet, funny, or wise..."></textarea>
            </div>
          </div>
          <button class="rsvp-send btn-micro" id="rsvpSend" type="submit"><span id="rsvpSendLabel">Send RSVP</span></button>
        </form>
      </div>
      <div id="rsvpDone" class="rsvp-done" hidden>
        <div class="rsvp-check"><svg width="40" height="30" viewBox="0 0 14 10" fill="none"><path d="M1 5L4.5 8.5L13 1" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2 id="thanksTitle"></h2>
        <p id="thanksText"></p>
      </div>
    </section>

    <!-- ============ FOOTER ============ -->
    <footer id="footer-section" data-reveal>
      <div class="footer-msg reveal" id="footerMsg"></div>
      <div class="footer-regards-wrap reveal">
        <span class="footer-regards" id="footerRegardsLabel"></span>
        <span class="footer-regards-name" id="footerRegards"></span>
      </div>
      <span class="footer-name reveal" id="footerNames"></span>
      <div class="footer-credit reveal" id="footerCredit"></div>
    </footer>

  </div><!-- /locked -->
</div><!-- /main-content -->

<div class="bright-flash" id="flash"></div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
