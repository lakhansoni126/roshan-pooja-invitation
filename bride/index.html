<div class="invite">
  <audio id="music" loop preload="none"></audio>
  <div class="sparkle-bg" aria-hidden="true"></div>

  <!-- mute / unmute -->

    <button id="muteBtn" class="icon-btn" type="button" aria-label="Toggle music">
      <svg class="ico" width="16" height="16"><use href="#i-volume-x"/></svg>
    </button>
  </div>

  <!-- ================= HERO ================= -->
  <section class="hero" id="hero">
    <video id="introVideo" class="hero-video" playsinline preload="auto" muted fetchpriority="high" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback nofullscreen"></video>

    <div class="hero-content" id="heroContent">
      <div class="hero-heart anim"><svg class="ico-fill" width="26" height="26"><use href="#i-heart"/></svg></div>
      <p class="hero-message anim" data-bind="hero.message"></p>
      <div class="hero-divider">
        <div class="line"></div>
        <svg class="ico-fill" width="10" height="10"><use href="#i-heart"/></svg>
        <div class="line"></div>
      </div>
      <h1 class="hero-name anim"><span data-bind="hero.groom.name"></span><p class="hero-subtext" data-bind="hero.groom.subtext"></p></h1>
      <p class="hero-amp anim">&amp;</p>
      <h1 class="hero-name anim"><span data-bind="hero.bride.name"></span><p class="hero-subtext" data-bind="hero.bride.subtext"></p></h1>
    </div>

    <div class="scroll-hint" id="scrollHint">
      <span data-bind="hero.scrollLabel"></span>
      <svg class="ico chev" width="28" height="28"><use href="#i-chevron-down"/></svg>
    </div>
  </section>

  <!-- ================= PAPER AREA ================= -->
  <div class="paper" id="paper">

    <section class="welcome">

          <div class="line r"></div>
        </div>
        <p class="welcome-text"><span data-bind="welcome.text"></span></p>
        <div class="welcome-divider bottom">
          <div class="line l"></div>
          <svg class="ico-fill" width="14" height="14"><use href="#i-heart"/></svg>
          <div class="line r"></div>
        </div>
      </div>
    </section>

    <div class="sections">

      <!-- Scratch to reveal -->
      <section class="sec reveal" id="sec-scratch">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <div class="center">
          <div>
            <h2 class="h2 scratch-title" data-bind="headings.scratch"></h2>
            <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
          </div>
          <div class="heart-box">
            <div class="heart-shadow" aria-hidden="true"></div>
            <div class="heart-clip">
              <div class="heart-face">
                <p class="invited" id="invitedText" data-bind="headings.scratchInvited"></p>
                <p class="h-date" data-bind="event.dateLabel"></p>
                <p class="h-day" data-bind="event.dayLabel"></p>
                <p class="h-time" data-bind="event.timeLabel"></p>
              </div>
              <canvas id="scratchCanvas" class="scratch" width="325" height="300"></canvas>
              <div class="heart-vignette" aria-hidden="true"></div>
              <div class="heart-gloss" aria-hidden="true"></div>

              <div class="scratch-hint" aria-hidden="true">
                <span class="hint-label" data-bind="headings.scratchLabel"></span>
                <div class="hint-stage">
                  <svg class="hint-trail" viewBox="0 0 200 90" preserveAspectRatio="none"><path d="M22 30 C 50 10, 70 60, 100 44 S 150 18, 178 52"/></svg>
                  <svg class="hint-hand" viewBox="0 0 24 24"><path d="M22 14a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15V4a2 2 0 0 1 4 0v5.5a2 2 0 0 1 4 0V10a2 2 0 0 1 4 0v1a2 2 0 1 1 4 0z"/></svg>
                </div>
              </div>
            </div>
            <svg class="heart-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M50,96 C50,96 6,70 6,36 C6,18 20,6 32,6 C42,6 48,14 50,24 C52,14 58,6 68,6 C80,6 94,18 94,36 C94,70 50,96 50,96 Z" fill="none" stroke="hsl(95, 22%, 32%)" stroke-width="1.2" vector-effect="non-scaling-stroke" opacity="0.7"/></svg>
          </div>
          <p class="scratch-cta" id="scratchCta"><svg class="ico" width="16" height="16"><use href="#i-pointer"/></svg><span data-bind="headings.scratchHint"></span></p>
        </div>
        <div class="std-wrap">
          <button type="button" class="std-btn" id="saveDateBtn" aria-expanded="false">
            <svg class="ico" width="16" height="16"><use href="#i-calendar-plus"/></svg><span data-bind="headings.saveTheDate"></span>
          </button>
        </div>
      </section>

      <!-- Slideshow -->
      <section class="sec reveal" id="sec-slides">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <div class="slideshow" id="slideshow">
          <div class="slides" id="slides"></div>
          <div class="slides-fade"></div>
          <div class="dots" id="dots"></div>
        </div>
      </section>

      <!-- Countdown -->
      <section class="sec reveal" id="sec-countdown">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <div class="center">
          <h2 class="h2 primary mb3" data-bind="headings.countdown"></h2>
          <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
          <div class="countdown">
            <div class="cd"><div class="cd-box"><div class="cd-num" id="cdDays">00</div></div><p class="cd-label">Days</p></div>
            <div class="cd"><div class="cd-box"><div class="cd-num" id="cdHours">00</div></div><p class="cd-label">Hours</p></div>
            <div class="cd"><div class="cd-box"><div class="cd-num" id="cdMinutes">00</div></div><p class="cd-label">Minutes</p></div>
            <div class="cd"><div class="cd-box"><div class="cd-num" id="cdSeconds">00</div></div><p class="cd-label">Seconds</p></div>
          </div>
        </div>
      </section>

      <!-- Timeline -->
      <section class="sec reveal" id="sec-timeline">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <div class="center">
          <svg class="ico sec-icon mb3" width="28" height="28"><use href="#i-clock"/></svg>
          <h2 class="h2 primary mb2" data-bind="headings.timeline"></h2>
          <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        </div>
        <div class="days" id="timelineDays"></div>
      </section>

      <!-- Venue -->
      <section class="sec reveal" id="sec-venue">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <svg class="ico sec-icon mb4" width="28" height="28"><use href="#i-map-pin"/></svg>
        <h2 class="h2 primary mb2 center" data-bind="headings.venue"></h2>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <div class="venue-text">
          <p class="venue-name" data-bind="venue.name"></p>
          <p class="muted" data-bind="venue.address"></p>
        </div>
        <div class="map-wrap"><iframe id="venueMap" width="100%" height="300" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Venue Map"></iframe></div>
      </section>

      <!-- Dress code -->
      <section class="sec reveal" id="sec-dress">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <svg class="ico sec-icon mb3" width="28" height="28"><use href="#i-shirt"/></svg>
        <h2 class="h2 primary mb2 center" data-bind="headings.dressCode"></h2>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <div class="dress-grid" id="dressGrid"></div>
      </section>

      <!-- Pre-wedding events -->
      <section class="sec reveal" id="sec-pre">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <svg class="ico sec-icon mb3" width="28" height="28"><use href="#i-party-popper"/></svg>
        <h2 class="h2 primary mb2 center" data-bind="headings.preEvents"></h2>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <div class="days" id="preDays"></div>
      </section>

      <!-- Transportation -->
      <section class="sec reveal" id="sec-transport">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <svg class="ico sec-icon mb3" width="28" height="28"><use href="#i-car"/></svg>
        <h2 class="h2 primary mb2 center" data-bind="headings.transportation"></h2>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <div class="text-block"><p class="muted pre" data-bind="transportation.text"></p></div>
      </section>

      <!-- Accommodation -->
      <section class="sec reveal" id="sec-stay">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <svg class="ico sec-icon mb3" width="28" height="28"><use href="#i-hotel"/></svg>

        <div class="text-block"><p class="muted pre" data-bind="accommodation.text"></p></div>
      </section>

      <!-- Gifts -->
      <section class="sec reveal" id="sec-gifts">

        <h2 class="h2 primary mb2 center" data-bind="headings.gifts"></h2>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <div class="text-block"><p class="muted pre"><span data-bind="gifts.text"></span></p></div>
      </section>

      <!-- RSVP -->
      <section class="sec reveal" id="sec-rsvp">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <svg class="flourish bl"><use href="#i-flourish"/></svg>
        <svg class="flourish br"><use href="#i-flourish"/></svg>
        <svg class="ico sec-icon mb3" width="28" height="28"><use href="#i-mail"/></svg>
        <h2 class="h2 primary mb3 center" data-bind="headings.rsvp"></h2>
        <div class="divider"><div class="line"></div><svg class="ico-fill heart" width="10" height="10"><use href="#i-heart"/></svg><div class="line"></div></div>
        <form class="rsvp" id="rsvpForm" novalidate>
          <div class="field">
            <label for="rsvpName"><span data-bind="rsvp.nameLabel"></span><span class="req" aria-hidden="true">*</span></label>
            <input id="rsvpName" class="input" required type="text">
          </div>
          <div class="field">
            <label for="rsvpAttend" class="with-icon"><svg class="ico" width="14" height="14"><use href="#i-users"/></svg> <span data-bind="rsvp.attendingLabel"></span><span class="req" aria-hidden="true">*</span></label>
            <div class="select-wrap">
              <select id="rsvpAttend" class="input select" required>
                <option value="" disabled selected data-bind="rsvp.selectPlaceholder"></option>
                <option value="yes" data-bind="rsvp.optionYes"></option>
                <option value="no" data-bind="rsvp.optionNo"></option>
              </select>
              <svg class="ico chev" width="16" height="16"><use href="#i-chevron-down"/></svg>
            </div>
          </div>
          <div class="field">
            <label for="rsvpMsg" data-bind="rsvp.messageLabel"></label>
            <textarea id="rsvpMsg" class="input textarea" rows="3"></textarea>
          </div>
          <button class="submit" type="submit" data-bind="rsvp.buttonLabel"></button>
          <p class="rsvp-done" id="rsvpDone" hidden data-bind="rsvp.thankYou"></p>
        </form>
      </section>

    </div>

    <!-- ================= CLOSING ================= -->
    <div class="ending" id="ending">
      <section class="sec reveal">
        <svg class="wave-top"><use href="#i-wave"/></svg>
        <div class="closing">
          <svg class="wave-line mb8"><use href="#i-wave"/></svg>
          <p class="closing-text pre" data-bind="closing.text"></p>
          <p class="closing-sign pre" data-bind="closing.signature"></p>
          <svg class="wave-line mt8 flip"><use href="#i-wave"/></svg>
        </div>
      </section>
      <footer class="footer">
        <svg class="flourish tl"><use href="#i-flourish"/></svg>
        <svg class="flourish tr"><use href="#i-flourish"/></svg>
        <p class="footer-names pre" data-bind="footer.names"></p>
        <p class="footer-credit"><span data-bind="footer.creditText"></span> <a id="creditLink" class="gold-text" href="#"><span data-bind="footer.creditLink"></span><span class="tm" aria-label="trademark">™</span></a></p>
      </footer>
    </div>
  </div>

  <!-- Save-the-date dropdown (positioned by script) -->
  <div class="cal-menu" id="calMenu" hidden>
    <button type="button" data-cal="google"><span>Google Calendar</span></button>
    <button type="button" data-cal="outlook"><span>Office 365 / Outlook</span></button>
    <button type="button" data-cal="yahoo"><span>Yahoo Calendar</span></button>
    <button type="button" data-cal="apple"><span>Apple Calendar</span></button>
    <button type="button" data-cal="ics"><span>Other (.ics file)</span></button>
    <p class="cal-note" id="calNote"></p>
  </div>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
</div>

<script src="config.js"></script>
<script src="../script.js"></script>
</body>
</html>
