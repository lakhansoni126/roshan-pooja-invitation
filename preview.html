<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone preview</title>
<style>
  body { margin: 0; min-height: 100vh; background: #1b1b1b; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; font: 13px system-ui, sans-serif; color: #ccc; }
  select { font: inherit; }
  iframe { border: 0; width: 390px; height: 844px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.6); background: #000; }
</style>
</head>
<body>
  <label>Phone size
    <select id="size">
      <option value="390x844">iPhone 14 (390×844)</option>
      <option value="375x667">iPhone SE (375×667)</option>
      <option value="360x800">Android (360×800)</option>
      <option value="412x915">Pixel 7 (412×915)</option>
      <option value="430x932">iPhone Pro Max (430×932)</option>
    </select>
  </label>
  <iframe id="frame" src="index.html" allow="autoplay"></iframe>
  <script>
    const f = document.getElementById('frame'), s = document.getElementById('size');
    const apply = () => { const [w, h] = s.value.split('x'); f.style.width = w + 'px'; f.style.height = h + 'px'; };
    s.addEventListener('change', apply);
    const q = new URLSearchParams(location.search).get('size'); if (q) { s.value = q; }
    apply();
  </script>
</body>
</html>
